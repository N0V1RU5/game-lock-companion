name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install psutil pystray pillow
      - name: Rules tests
        run: python tools/test_zamek.py
      - name: GUI self-test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          xvfb-run -a python herni_zamek.pyw --selftest
      - name: GUI self-test
        if: runner.os != 'Linux'
        run: python herni_zamek.pyw --selftest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pyinstaller psutil
      - name: Install tray icon dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install pystray pillow
      - name: Build
        run: python tools/build_exe.py
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
